    // --- Audio Synthesizer (Zero external file dependencies) ---
    let audioCtx = null;
    function getAudioContext() {
      if (typeof window === 'undefined') return null;
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playNotificationSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(784, now); // G5
        gain1.gain.setValueAtTime(0.15, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.35);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1046.5, now + 0.12); // C6
        gain2.gain.setValueAtTime(0.2, now + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.12);
        osc2.stop(now + 0.6);
      } catch (e) {
        console.warn('Audio not permitted yet:', e);
      }
    }

    function playSuccessChime() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const startTime = now + idx * 0.08;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.15, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.4);
        });
      } catch (e) {}
    }

    function vibrateMobile(pattern = [150, 80, 150]) {
      if ('navigator' in window && 'vibrate' in navigator) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    // --- Format Utilities ---
    function formatCurrency(val) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
    }

    function formatDateBR(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return dateStr;
    }

    function getDaysUntil(dateStr) {
      if (!dateStr) return 0;
      const [y, m, d] = dateStr.split('-').map(Number);
      const target = new Date(y, m - 1, d);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((target.getTime() - today.getTime()) / (1000 * 3600 * 24));
    }

    function getWhatsAppUrl(phone, text) {
      let clean = (phone || '').replace(/\D/g, '');
      if (clean.length === 10 || clean.length === 11) clean = `55${clean}`;
      return `https://wa.me/${clean}?text=${encodeURIComponent(text)}`;
    }

    function generateReceiptText(event) {
      const dateFormatted = formatDateBR(event.date);
      const itemsList = event.items && event.items.length > 0 
        ? event.items.map(i => `  • ${i.quantity}x ${i.name}`).join('\n')
        : '  • Pacote padrão de decoração';

      return `✨ *COMPROVANTE DE AGENDAMENTO - GIH DECORAÇÕES* ✨

Olá, *${event.clientName}*! Seguem os detalhes da sua festa agendada:

🎈 *Tema:* ${event.theme}
📦 *Pacote:* ${event.packageType}
📅 *Data do Evento:* ${dateFormatted}
⏰ *Montagem:* ${event.setupTime}
🎉 *Horário da Festa:* ${event.startTime} às ${event.endTime}
🚚 *Desmontagem / Recolha:* ${event.teardownTime}
📍 *Local:* ${event.location}

📋 *Itens Locados:*
${itemsList}

💰 *Valores:*
• Valor Total: ${formatCurrency(event.totalAmount)}
• Sinal / Entrada: ${formatCurrency(event.depositAmount)}
• Saldo Restante: ${formatCurrency(event.remainingAmount)}
• Status de Pagamento: ${event.paymentStatus === 'quitado' ? '✅ Quitado' : event.paymentStatus === 'sinal_pago' ? '💳 Sinal Confirmado' : '⏳ Pendente'}

${event.notes ? `📝 *Observações:* ${event.notes}\n` : ''}
Agradecemos a preferência!
*Gih Decorações de Festas* 💖`;
    }

    // --- Local Database Engine ---
    const DB_STORAGE_KEY = 'gih_decoracoes_db_v1';

    function loadDatabase() {
      try {
        const raw = localStorage.getItem(DB_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.clients) && Array.isArray(parsed.events)) {
            return parsed;
          }
        }
      } catch (e) {
        console.error('Falha ao ler banco local:', e);
      }
      return {
        clients: [],
        events: [],
        notifications: [],
        lastUpdated: new Date().toISOString()
      };
    }

    function saveDatabase(db) {
      db.lastUpdated = new Date().toISOString();
      localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(db));
    }

    function refreshNotifications(db) {
      const todayStr = new Date().toISOString().split('T')[0];
      const existingKeys = new Set(db.notifications.map(n => `${n.eventId}_${n.type}_${n.date}`));

      db.events.forEach(ev => {
        if (ev.status === 'cancelado' || ev.status === 'concluido') return;
        const diff = getDaysUntil(ev.date);

        if (diff === 0) {
          const key = `${ev.id}_hoje_${ev.date}`;
          if (!existingKeys.has(key)) {
            db.notifications.unshift({
              id: 'notif-' + Date.now() + Math.random(),
              eventId: ev.id,
              title: `🚨 Festa HOJE: ${ev.theme}`,
              message: `Início da montagem às ${ev.setupTime} em ${ev.location}. Cliente: ${ev.clientName}.`,
              type: 'hoje',
              read: false,
              date: ev.date
            });
          }
        } else if (diff === 1) {
          const key = `${ev.id}_amanha_${ev.date}`;
          if (!existingKeys.has(key)) {
            db.notifications.unshift({
              id: 'notif-' + Date.now() + Math.random(),
              eventId: ev.id,
              title: `⏰ Festa AMANHÃ: ${ev.theme}`,
              message: `Separe as peças para ${ev.clientName}. Montagem amanhã às ${ev.setupTime}.`,
              type: 'amanha',
              read: false,
              date: ev.date
            });
          }
        }

        if (diff >= 0 && diff <= 1 && ev.remainingAmount > 0 && ev.paymentStatus !== 'quitado') {
          const key = `${ev.id}_pagamento_${ev.date}`;
          if (!existingKeys.has(key)) {
            db.notifications.unshift({
              id: 'notif-' + Date.now() + Math.random(),
              eventId: ev.id,
              title: `💰 Saldo Pendente: ${formatCurrency(ev.remainingAmount)}`,
              message: `Lembrar cliente ${ev.clientName} do acerto na festa ${ev.theme}.`,
              type: 'pagamento',
              read: false,
              date: ev.date
            });
          }
        }
      });

      if (db.notifications.length > 50) {
        db.notifications = db.notifications.slice(0, 50);
      }
    }

                <span className="text-[10px] mt-1">Valores</span>
              </button>
              <button onClick={() => setTab('avisos')} className={`flex flex-col items-center justify-center ${tab === 'avisos' ? 'text-rose-600 font-bold' : 'text-slate-400'}`}>
                <IconBell className="w-5 h-5" />
                <span className="text-[10px] mt-1">Avisos</span>
              </button>
            </div>
          </div>

          {/* MODAL: Nova / Editar Festa */}
          {isNewEventOpen && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl border border-slate-200 my-8 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="text-lg font-bold text-slate-900">{eventToEdit ? 'Editar Festa' : 'Agendar Nova Festa'}</h3>
                  <button onClick={() => setIsNewEventOpen(false)} className="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  let cId = fd.get('clientId');
                  let cName = fd.get('clientName');
                  let cPhone = fd.get('clientPhone');

                  if (!cId && cName && cPhone) {
                    const db = loadDatabase();
                    const newC = { id: 'cl-' + Date.now(), name: cName, phone: cPhone, whatsapp: cPhone.replace(/\D/g, ''), createdAt: new Date().toISOString() };
                    db.clients.unshift(newC);
                    saveDatabase(db);
                    cId = newC.id;
                  } else if (cId) {
                    const found = clients.find(c => c.id === cId);
                    if (found) { cName = found.name; cPhone = found.phone; }
                  }

                  handleSaveEvent({
                    clientId: cId,
                    clientName: cName,
                    clientPhone: cPhone,
                    theme: fd.get('theme'),
                    packageType: fd.get('packageType'),
                    date: fd.get('date'),
                    setupTime: fd.get('setupTime'),
                    startTime: fd.get('startTime'),
                    endTime: fd.get('endTime'),
                    teardownTime: fd.get('teardownTime'),
                    location: fd.get('location') || 'A definir',
                    totalAmount: Number(fd.get('totalAmount')) || 0,
                    depositAmount: Number(fd.get('depositAmount')) || 0,
                    paymentStatus: 'sinal_pago',
                    paymentMethod: 'pix',
                    notes: fd.get('notes'),
                    items: [
                      { id: 'i1', name: 'Painel Decorativo', quantity: 1 },
                      { id: 'i2', name: 'Trio de Cilindros', quantity: 3 },
                      { id: 'i3', name: 'Arco de Balões', quantity: 1 }
                    ]
                  });
                }} className="space-y-4 text-xs">
                  {/* Client Info */}
                  <div className="p-3 bg-rose-50/50 rounded-xl space-y-2 border border-rose-100">
                    <span className="font-bold text-rose-900 block">Dados da Cliente</span>
                    {clients.length > 0 ? (
                      <div>
                        <label className="block mb-1 text-slate-600">Selecionar Cliente Cadastrada</label>
                        <select name="clientId" defaultValue={eventToEdit?.clientId || clients[0]?.id} className="w-full p-2 bg-white border border-slate-200 rounded-lg">
                          {clients.map(c => <option key={c.id} value={c.id}>{c.name} ({c.phone})</option>)}
                        </select>
                      </div>
                    ) : (
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block mb-1 text-slate-600">Nome da Cliente *</label>
                          <input name="clientName" required defaultValue={eventToEdit?.clientName || ''} placeholder="Ex: Mariana Santos" className="w-full p-2 bg-white border border-slate-200 rounded-lg" />
                        </div>
                        <div>
                          <label className="block mb-1 text-slate-600">WhatsApp / Celular *</label>
                          <input name="clientPhone" required defaultValue={eventToEdit?.clientPhone || ''} placeholder="(11) 99999-9999" className="w-full p-2 bg-white border border-slate-200 rounded-lg" />
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Theme & Package */}
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block mb-1 font-semibold text-slate-700">Tema da Festa *</label>
                      <input name="theme" required defaultValue={eventToEdit?.theme || ''} placeholder="Ex: Safari Baby Chic" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                    </div>
                    <div>
                      <label className="block mb-1 font-semibold text-slate-700">Tipo de Pacote *</label>
                      <select name="packageType" defaultValue={eventToEdit?.packageType || 'Decoração Completa'} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg">
                        <option value="Decoração Completa">Decoração Completa</option>
                        <option value="Pegue e Monte">Pegue e Monte</option>
                        <option value="Arco de Balões">Arco de Balões</option>
                        <option value="Mini Table">Mini Table</option>
                        <option value="Locação de Peças">Locação de Peças</option>
                      </select>
                    </div>
                  </div>

                  {/* Date & Hours */}
                  <div className="grid grid-cols-4 gap-2">
                    <div>
                      <label className="block mb-1 font-semibold text-slate-700">Data *</label>
                      <input type="date" name="date" required defaultValue={eventToEdit?.date || initialEventDate || todayStr} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                    </div>
                    <div>
                      <label className="block mb-1 font-semibold text-slate-700">Montagem</label>
                      <input type="time" name="setupTime" defaultValue={eventToEdit?.setupTime || '10:00'} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                    </div>
                    <div>
                      <label className="block mb-1 font-semibold text-slate-700">Início Festa</label>
                      <input type="time" name="startTime" defaultValue={eventToEdit?.startTime || '14:00'} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                    </div>
                    <div>
                      <label className="block mb-1 font-semibold text-slate-700">Desmontagem</label>
                      <input type="time" name="teardownTime" defaultValue={eventToEdit?.teardownTime || '19:30'} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                    </div>
                  </div>

                  {/* Location */}
                  <div>
                    <label className="block mb-1 font-semibold text-slate-700">Local da Festa</label>
                    <input name="location" defaultValue={eventToEdit?.location || ''} placeholder="Buffet, salão do condomínio ou endereço" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                  </div>

                  {/* Financial */}
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block mb-1 font-semibold text-slate-700">Valor Total (R$) *</label>
                      <input type="number" step="10" name="totalAmount" required defaultValue={eventToEdit?.totalAmount || 1200} className="w-full p-2 font-bold bg-slate-50 border border-slate-200 rounded-lg" />
                    </div>
                    <div>
                      <label className="block mb-1 font-semibold text-slate-700">Sinal / Entrada Paga (R$)</label>
                      <input type="number" step="10" name="depositAmount" defaultValue={eventToEdit?.depositAmount || 600} className="w-full p-2 font-bold bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-lg" />
                    </div>
                  </div>

                  <div>
                    <label className="block mb-1 font-semibold text-slate-700">Observações</label>
                    <textarea name="notes" defaultValue={eventToEdit?.notes || ''} rows={2} placeholder="Paleta de cores, restrições de horário do buffet..." className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                  </div>

                  <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
                    <button type="button" onClick={() => setIsNewEventOpen(false)} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl">Cancelar</button>
                    <button type="submit" className="px-5 py-2 font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-xl cursor-pointer">Salvar na Agenda</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: Cliente */}
          {isClientModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="text-base font-bold text-slate-900">{clientToEdit ? 'Editar Cliente' : 'Cadastrar Cliente'}</h3>
                  <button onClick={() => setIsClientModalOpen(false)} className="w-7 h-7 rounded-full bg-slate-100 text-slate-500">✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleSaveClient({
                    name: fd.get('name'),
                    phone: fd.get('phone'),
                    document: fd.get('document'),
                    address: fd.get('address'),
                    notes: fd.get('notes')
                  });
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block mb-1 font-semibold text-slate-700">Nome Completo *</label>
                    <input name="name" required defaultValue={clientToEdit?.name || ''} placeholder="Ex: Fernanda Lima" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                  </div>
                  <div>
                    <label className="block mb-1 font-semibold text-slate-700">WhatsApp / Telefone *</label>
                    <input name="phone" required defaultValue={clientToEdit?.phone || ''} placeholder="(11) 99999-9999" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                  </div>
                  <div>
                    <label className="block mb-1 font-semibold text-slate-700">CPF / Documento</label>
                    <input name="document" defaultValue={clientToEdit?.document || ''} placeholder="000.000.000-00" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                  </div>
                  <div>
                    <label className="block mb-1 font-semibold text-slate-700">Endereço</label>
                    <input name="address" defaultValue={clientToEdit?.address || ''} placeholder="Rua, número, bairro" className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                  </div>
                  <div>
                    <label className="block mb-1 font-semibold text-slate-700">Observações</label>
                    <textarea name="notes" defaultValue={clientToEdit?.notes || ''} rows={2} placeholder="Preferências de temas, referências..." className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                  </div>
                  <div className="pt-2 border-t border-slate-100 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsClientModalOpen(false)} className="px-3 py-1.5 bg-slate-100 rounded-lg">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 font-bold text-white bg-rose-600 rounded-lg">Salvar Cliente</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: Contrato & Recibo Imprimível / WhatsApp */}
          {receiptEvent && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4 my-8">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h4 className="text-base font-bold text-slate-900">Comprovante de Reserva</h4>
                  <button onClick={() => setReceiptEvent(null)} className="w-7 h-7 rounded-full bg-slate-100 text-slate-500">✕</button>
                </div>

                <div id="printable-receipt" className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3 text-xs text-slate-800">
                  <div className="text-center pb-2 border-b border-slate-200">
                    <span className="text-[10px] font-bold text-rose-600 uppercase tracking-wider block">Gih Decorações de Festas</span>
                    <strong className="text-sm font-black text-slate-900">Comprovante de Locação & Agenda</strong>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><span className="text-slate-400 block text-[10px]">Cliente</span><strong>{receiptEvent.clientName}</strong><br />{receiptEvent.clientPhone}</div>
                    <div className="text-right"><span className="text-slate-400 block text-[10px]">Data do Evento</span><strong className="text-rose-600">{formatDateBR(receiptEvent.date)}</strong></div>
                  </div>
                  <div className="p-2 bg-white rounded-lg border border-slate-200 space-y-1">
                    <div><span className="text-slate-400 block text-[10px]">Tema</span><strong>{receiptEvent.theme}</strong> ({receiptEvent.packageType})</div>
                    <div><span className="text-slate-400 block text-[10px]">Local</span>{receiptEvent.location}</div>
                    <div className="grid grid-cols-3 text-center pt-1 border-t border-slate-100">
                      <div><span className="text-[9px] text-slate-400 block">Montagem</span><strong>{receiptEvent.setupTime}</strong></div>
                      <div><span className="text-[9px] text-slate-400 block">Festa</span><strong className="text-rose-600">{receiptEvent.startTime} - {receiptEvent.endTime}</strong></div>
                      <div><span className="text-[9px] text-slate-400 block">Recolha</span><strong>{receiptEvent.teardownTime}</strong></div>
                    </div>
                  </div>
                  <div className="p-2 bg-white rounded-lg border border-slate-200 space-y-1">
                    <div className="flex justify-between"><span>Valor Total:</span><strong>{formatCurrency(receiptEvent.totalAmount)}</strong></div>
                    <div className="flex justify-between text-emerald-700"><span>Sinal Pago:</span><strong>{formatCurrency(receiptEvent.depositAmount)}</strong></div>
                    <div className="flex justify-between text-rose-600 font-bold border-t border-slate-100 pt-1">
                      <span>Saldo a Pagar:</span><span>{formatCurrency(receiptEvent.remainingAmount)}</span>
                    </div>
                  </div>
                </div>

                <div className="flex items-center justify-between pt-2">
                  <button onClick={() => window.print()} className="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 rounded-lg">Imprimir</button>
                  <a
                    href={getWhatsAppUrl(receiptEvent.clientPhone, generateReceiptText(receiptEvent))}
                    target="_blank"
                    className="px-4 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl"
                  >
                    Enviar no WhatsApp
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: Detalhes do Evento */}
          {selectedEvent && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-3">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <div>
                    <span className="text-[10px] font-bold text-rose-600 uppercase">{selectedEvent.packageType}</span>
                    <h3 className="text-lg font-bold text-slate-900">{selectedEvent.theme}</h3>
                  </div>
                  <button onClick={() => setSelectedEvent(null)} className="w-7 h-7 rounded-full bg-slate-100 text-slate-500">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="p-3 bg-slate-50 rounded-xl space-y-1">
                    <div className="flex justify-between"><span>Data:</span><strong>{formatDateBR(selectedEvent.date)}</strong></div>
                    <div className="flex justify-between"><span>Montagem:</span><strong>{selectedEvent.setupTime}</strong></div>
                    <div className="flex justify-between"><span>Festa:</span><strong>{selectedEvent.startTime} às {selectedEvent.endTime}</strong></div>
                    <div className="flex justify-between"><span>Desmontagem:</span><strong>{selectedEvent.teardownTime}</strong></div>
                    <div className="flex justify-between"><span>Local:</span><strong>{selectedEvent.location}</strong></div>
                  </div>

                  <div className="p-3 bg-slate-50 rounded-xl space-y-1">
                    <div className="flex justify-between"><span>Cliente:</span><strong>{selectedEvent.clientName}</strong></div>
                    <div className="flex justify-between"><span>Contato:</span><strong>{selectedEvent.clientPhone}</strong></div>
                    <div className="flex justify-between"><span>Total:</span><strong>{formatCurrency(selectedEvent.totalAmount)}</strong></div>
                    <div className="flex justify-between text-emerald-700"><span>Sinal:</span><strong>{formatCurrency(selectedEvent.depositAmount)}</strong></div>
                    <div className="flex justify-between text-rose-600 font-bold"><span>Restante:</span><strong>{formatCurrency(selectedEvent.remainingAmount)}</strong></div>
                  </div>

                  {selectedEvent.notes && (
                    <div className="p-2.5 bg-amber-50 rounded-xl text-amber-900 border border-amber-200">
                      <strong>Obs:</strong> {selectedEvent.notes}
                    </div>
                  )}

                  <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                    <button
                      onClick={() => {
                        handleDeleteEvent(selectedEvent.id);
                      }}
                      className="px-3 py-1.5 text-xs text-rose-600 hover:bg-rose-50 rounded-lg"
                    >
                      Excluir
                    </button>

                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => {
                          const s = selectedEvent;
                          setSelectedEvent(null);
                          setEventToEdit(s);
                          setIsNewEventOpen(true);
                        }}
                        className="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 rounded-lg"
                      >
                        Editar
                      </button>
                      <button
                        onClick={() => {
                          const s = selectedEvent;
                          setSelectedEvent(null);
                          setReceiptEvent(s);
                        }}
                        className="px-4 py-1.5 text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-lg"
                      >
                        Recibo
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount to DOM
    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<App />);
  </script>


</body></html>
